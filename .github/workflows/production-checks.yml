name: Production regression checks
on:
  pull_request:
  push:
    branches:
      - feature/production-cues-061
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: find scripts -name '*.js' -print0 | xargs -0 -n 1 node --check
